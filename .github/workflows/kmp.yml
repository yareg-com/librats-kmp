name: KMP library publishing

on:
  push:
    branches:
      - kmp
#    branches: [kmp, master]
#  pull_request:
#    branches: [main, master]
  release:
    types: [created]

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  publish:
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v6.0.2 # https://github.com/actions/checkout

      - name: Set up JDK 21
        uses: actions/setup-java@v5.6.0 # https://github.com/actions/setup-java
        with:
          distribution: 'temurin'
          java-version: '21'
              
      - name: Make gradlew executable
        run: chmod +x gradlew
        
      - name: Publish to GitHub Packages
        run: ./gradlew publish
        env:
          GITHUB_ACTOR: ${{ github.actor }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}    
