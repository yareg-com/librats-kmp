name: Publish

on:
  push:
    branches:
      - main
      - dev-*
#    branches: [kmp, master]
#  pull_request:
#    branches: [main, master]
  release:
    types: [created]

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  publish:
    runs-on: ubuntu-latest
#    defaults:
#      run:
#        working-directory: ./kmp

    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v6.0.2 # https://github.com/actions/checkout

      - name: Set up JDK 21
        uses: actions/setup-java@v5.6.0 # https://github.com/actions/setup-java
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: 'gradle'
        
      - name: Publish to GitHub Packages
        run: |
          chmod +x gradlew
          SHORT_SHA="${GITHUB_SHA:0:7}"
          ./gradlew publishAllPublicationsToGitHubPackagesRepository -Pversion="$SHORT_SHA"
        env:
          GITHUB_ACTOR: ${{ github.actor }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}

  cleanup:
    runs-on: ubuntu-latest
    needs: publish
    permissions:
      contents: read
      packages: write

    steps:
      - name: Delete old untagged package versions
        uses: actions/delete-package-versions@v5
        with:
          # Delete all untagged versions except the three latest ones.
          # Note: delete-only-untagged-versions only applies to container packages;
          # for Maven packages it is ignored, but min-versions-to-keep still retains 3 latest.
          package-name: 'com.github.yareg-com.librats'
          package-type: 'maven'
          min-versions-to-keep: 3
          delete-only-untagged-versions: true
